name: CI

# Every pull request, plus every push to main (i.e. each squash merge).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, unit and integration tests
        run: mvn -B verify

  analysis-service:
    name: Analysis service (install + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: pip install -r requirements.txt httpx
      - name: Health endpoint answers and finds Stockfish
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app
          body = TestClient(app).get("/health").json()
          print(body)
          assert body["status"] == "UP" and body["engine"] == "UP", body
          EOF

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    needs: [backend, analysis-service]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Start the stack and smoke-test the health endpoints
        run: |
          docker compose up -d --build
          for url in http://localhost:8000/health http://localhost:8080/health; do
            for i in $(seq 1 60); do curl -fsS "$url" && echo && break; sleep 2; done
            curl -fsS "$url" > /dev/null
          done
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
