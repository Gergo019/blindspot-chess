name: CI

# Every pull request, plus every push to main (i.e. each squash merge).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, unit and integration tests
        run: mvn -B verify

  analysis-service:
    # The job name is a required status check on main; keep it unchanged.
    name: Analysis service (install + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis-service
    steps:
      - uses: actions/checkout@v7
      # Tests run inside the Docker image, so they use exactly the pinned,
      # checksum-verified Stockfish binary that production uses. Never
      # install Stockfish on the runner.
      - name: Build the test image (pinned Stockfish)
        run: docker build --target test -t analysis-test .
      - name: Run pytest inside the image
        run: docker run --rm analysis-test

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    needs: [backend, analysis-service]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - name: Start the stack and smoke-test the health endpoints
        run: |
          docker compose up -d --build
          for url in http://localhost:8000/health http://localhost:8080/health; do
            for i in $(seq 1 60); do curl -fsS "$url" && echo && break; sleep 2; done
            curl -fsS "$url" > /dev/null
          done
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
