spring:
  application:
    name: blindspot-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blindspot}
    username: ${DB_USERNAME:blindspot}
    password: ${DB_PASSWORD:blindspot}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

server:
  port: 8080

blindspot:
  analysis-service-url: ${ANALYSIS_SERVICE_URL:http://localhost:8000}
  lichess:
    base-url: https://lichess.org
    api-token: ${LICHESS_API_TOKEN:}
