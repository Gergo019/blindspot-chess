# Security headers for every response (#60). Included at server level AND in every location that sets
# its own add_header: nginx drops all inherited add_header directives as soon as a location declares
# one, so a location without this include would silently lose them. frontend/src/security.test.ts
# checks that every such location includes this file and that the CSP allows the inline script.
#
# CSP: only same-origin scripts, styles, fonts, images and requests (/api is same-origin through this
# nginx), plus the one inline script in index.html by its hash. React sets inline styles through the
# CSSOM, which CSP does not block. If index.html's inline script changes, its hash here must change.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-cAFnl6AYT8BdvfecwvT6hOAcxf/zBBq5skQ+0wNkoi4='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
