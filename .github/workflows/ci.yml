name: CI

# Every pull request, plus every push to main (i.e. each squash merge).
on:
  push:
    branches: [main]
  pull_request:

# Least privilege (#60): the jobs only read the repository. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, unit and integration tests
        run: mvn -B verify

  analysis-service:
    # The job name is a required status check on main; keep it unchanged.
    name: Analysis service (install + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tests run inside the Docker image, so they use exactly the pinned,
      # checksum-verified Stockfish binary that production uses. Never
      # install Stockfish on the runner.
      - name: Build the test image (pinned Stockfish)
        run: docker build --target test -t analysis-test .
      - name: Run pytest inside the image
        run: docker run --rm analysis-test

  frontend:
    # The job name is meant to become a required status check on main; keep it unchanged.
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests (incl. WCAG contrast of every theme token pair)
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    needs: [backend, analysis-service, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - name: Start the stack and smoke-test the health endpoints
        run: |
          docker compose up -d --build
          for url in http://localhost:8080/health http://localhost:8081/healthz; do
            for i in $(seq 1 60); do curl -fsS "$url" && echo && break; sleep 2; done
            curl -fsS "$url" > /dev/null
          done
          # The analysis service publishes no port (#60): check it from inside its container.
          docker compose exec -T analysis-service python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)))"
          test "$(docker compose ps --format '{{.Health}}' analysis-service)" = healthy
      - name: Frontend serves the app and proxies /api to the backend
        run: |
          curl -fsS http://localhost:8081/ | grep -q "<title>BlindSpot</title>"
          # /api/proxy-check does not exist. Through nginx it must give the backend's own answer: the same
          # status as asking the backend directly, and its RFC 9457 problem detail naming the path (#51).
          # nginx's 404 page or the single-page-app fallback (200, index.html) would not.
          via_frontend=$(curl -sS -w '\n%{http_code}' http://localhost:8081/api/proxy-check)
          direct=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/proxy-check)
          echo "via frontend: $via_frontend"; echo "direct status: $direct"
          test "$(echo "$via_frontend" | tail -n1)" = "$direct"
          echo "$via_frontend" | grep -q '"instance":"/api/proxy-check"'
          test "$(docker compose ps --format '{{.Health}}' frontend)" = healthy
      - name: Ports are published on 127.0.0.1 only, and the analysis service not at all
        run: |
          docker compose ps --format '{{.Service}} {{.Ports}}'
          ! docker compose ps --format '{{.Ports}}' | grep -E '0\.0\.0\.0|\[::\]'
          test -z "$(docker compose ps --format '{{.Ports}}' analysis-service | grep -- '->' || true)"
      - name: Frontend sends the security headers
        run: |
          headers=$(curl -fsS -D - -o /dev/null http://localhost:8081/)
          echo "$headers"
          echo "$headers" | grep -qi "^content-security-policy: .*frame-ancestors 'none'"
          echo "$headers" | grep -qi "^x-content-type-options: nosniff"
          echo "$headers" | grep -qi "^x-frame-options: DENY"
          echo "$headers" | grep -qi "^referrer-policy: same-origin"
          ! echo "$headers" | grep -qi "^server: nginx/[0-9]"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
