version: 2

# One grouped pull request per ecosystem instead of one per dependency.
# Java LTS and Python upgrades are done by hand (see docs/devlog.md,
# "Post-merge cleanup"), so their base images only get the updates below.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: pip
    # The analysis service (pip-compile lock with hashes) and the demo-data tool (plain pins).
    directories: [/analysis-service, /tools/demo-data]
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # TypeScript 7 breaks type-aware linting: typescript-eslint 8.73 supports only
      # typescript ">=4.8.4 <6.1.0", so a grouped PR with TypeScript 7 fails `npm ci` (ERESOLVE, #58).
      # Remove when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Playwright must match the browser image pinned by digest in .github/workflows/ci.yml (job
      # "End-to-end (Playwright)"), which Dependabot cannot update. Upgrade both by hand, together:
      # @playwright/test, the playwright-core override in frontend/package.json, and the image.
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright-core"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /analysis-service, /frontend]
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # Images are pinned by digest (tag@sha256): Dependabot keeps proposing new digests for the
      # same tag, which is how patch releases of the image arrive. The rules below only stop it
      # from changing the tag itself.
      # Java: stay on the chosen LTS (eclipse-temurin:25-jre).
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      # maven:3.9-eclipse-temurin-25 is read by Dependabot as version 3.9 with build number 25
      # (dependabot-core docker/tag.rb), i.e. 3.9.25, so a JDK change to -26 looks like a PATCH
      # update (#18). Ignore every tag change; Maven and JDK upgrades are done by hand.
      - dependency-name: maven
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # Node: stay on the chosen LTS line (node:26); LTS upgrades are done by hand with .nvmrc.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Python: stay on the version the tests run on (python:3.13-slim).
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # docker-compose.yml: the database image (#72). The `docker` ecosystem only reads Dockerfiles, so
  # Compose files need this one. The image is pinned by digest; Dependabot proposes new digests.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # pgvector/pgvector:pg17 reads as version 17: stay on PostgreSQL 17. A major upgrade needs a
      # data migration (dump and restore, or pg_upgrade) and is done by hand.
      - dependency-name: pgvector/pgvector
        update-types: ["version-update:semver-major"]
